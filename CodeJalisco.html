<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CodeJalisco</title>
<style>/* CodeJalisco · identidad visual de los Sprints 1 y 2 (verde olivo, crema, tipografía serif) */
:root{--verde:#3f5430;--verde-osc:#263318;--tinta:#232d17;--texto:#46503a;--crema:#f4f3eb;--salvia:#d5d7c2;--banda:#dfe0cc;--card:#fdfdf9;--borde:#d6d8c6;--error:#8a2c1f;--ok:#2f6b2f}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--crema);color:var(--texto);font:17px/1.6 "Times New Roman",Times,serif}
h1,h2,h3{color:var(--tinta);line-height:1.2;margin:0 0 .6rem}
h1{font-size:clamp(2rem,4.2vw,2.9rem)}h2{font-size:1.5rem}h3{font-size:1.15rem}
a{color:var(--verde)}
.wrap{max-width:1110px;margin:0 auto;padding:0 1.25rem}
:focus-visible{outline:3px solid #b08a00;outline-offset:2px}
/* Encabezado */
.top{background:var(--verde);border-bottom:4px solid var(--verde-osc);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:.8rem;padding-bottom:.8rem}
.marca{display:flex;align-items:center;gap:.8rem;color:#fff;text-decoration:none}
.logo{width:50px;height:50px;border:1px solid #ffffffaa;display:grid;place-items:center;font-weight:bold;font-size:1.3rem}
.marca b{display:block;font-size:1.3rem;line-height:1.1}.marca small{font-size:.9rem;opacity:.9}
.top nav{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.top nav a,.top nav button{color:#fff;text-decoration:none;padding:.4rem .8rem;border:1px solid transparent;border-radius:6px;background:none;font:inherit;cursor:pointer}
.top nav a:hover,.top nav button:hover{background:#ffffff1f}
.top nav a[aria-current=page]{background:var(--verde-osc);border-color:#fff;text-decoration:underline}
.sesion{display:flex;align-items:center;gap:.3rem;margin-left:.6rem;padding-left:.8rem;border-left:1px solid #ffffff55;font-size:.95rem}
.rol{font-size:.8rem;background:#fff;color:var(--verde-osc);border-radius:99px;padding:0 .55rem;margin-left:.3rem}
/* Hero y secciones */
.hero{background:var(--salvia);padding:3rem 0}
.hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:3rem;align-items:start}
.chip{display:inline-block;border:1px solid var(--tinta);border-radius:99px;padding:.1rem .9rem;font-size:.9rem;color:var(--tinta);margin-bottom:1rem}
.lead{font-size:1.15rem}
.acciones{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.4rem}
.btn{display:inline-block;font:inherit;padding:.65rem 1.2rem;border:1px solid var(--verde);border-radius:4px;background:var(--verde);color:#fff;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--verde-osc)}
.btn.sec{background:transparent;color:var(--tinta);border-color:#8d917a}.btn.sec:hover{background:#ffffff80}
.btn.google{background:#fff;color:#222;border-color:#a9ac98;width:100%;display:flex;gap:.6rem;justify-content:center;align-items:center}
.btn[disabled]{opacity:.6;cursor:wait}
.card{background:var(--card);border:1px solid var(--borde);border-radius:4px;padding:1.4rem 1.5rem;box-shadow:0 1px 2px #0001}
.lista{list-style:none;margin:0;padding:0}
.lista li{padding:.55rem 0 .55rem 1.3rem;border-bottom:1px solid var(--borde);position:relative}
.lista li:last-child{border:0}.lista li:before{content:"";position:absolute;left:0;top:1.1rem;width:9px;height:9px;border-radius:50%;background:var(--verde)}
.seccion{padding:2.6rem 0}
.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin-top:1.4rem}
.num{width:45px;height:45px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin-bottom:1rem}
.banda{background:var(--banda);border-block:1px solid var(--borde);padding:2rem 0}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.pagina .wrap{max-width:980px}.pagina{padding:2.4rem 0 3.5rem}.angosta{max-width:760px}.media{max-width:1110px}
/* Formularios */
label{display:block;font-weight:bold;color:var(--tinta);margin-bottom:.3rem;font-size:.97rem}
input,select,textarea{width:100%;font:inherit;color:var(--tinta);background:var(--card);border:1px solid #b9bca8;border-radius:4px;padding:.6rem .75rem}
textarea{min-height:110px;resize:vertical}
.campo{margin-bottom:1.1rem}.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 1.3rem}
.ayuda{font-size:.9rem;color:#6b7360;margin:.25rem 0 0}
.fila-btn{border-top:1px solid var(--borde);padding-top:1.2rem;margin-top:.4rem;display:flex;gap:.7rem;flex-wrap:wrap}
.buscar{display:flex;gap:.7rem}.buscar input{flex:1}
.aviso{border-left:4px solid var(--verde);background:#eef0df;padding:.7rem 1rem;margin-bottom:1.2rem;border-radius:3px}
.aviso.error{border-color:var(--error);background:#f7e6e1;color:var(--error)}
.separador{display:flex;align-items:center;gap:.8rem;color:#6b7360;margin:1.1rem 0}.separador:before,.separador:after{content:"";flex:1;border-top:1px solid var(--borde)}
/* Estados y tablas */
.pill{display:inline-block;border-radius:99px;padding:0 .7rem;font-size:.88rem;border:1px solid #9a9f86;background:#e4e5d6;color:var(--tinta);white-space:nowrap}
.pill.rev{background:#ecebc7;border-color:#b3ae6a}.pill.aten{background:#cfd6bf;border-color:#7d8a66}.pill.ok{background:var(--verde);color:#fff;border-color:var(--verde)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin:1.4rem 0}
.stats .card{padding:1rem 1.2rem}.stats b{display:block;font-size:1.9rem;color:var(--tinta);line-height:1.2}
.filtros{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:1.1rem;margin-bottom:1.4rem}.filtros .campo{margin:0}
.tabla-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{background:var(--verde-osc);color:#fff;text-align:left;padding:.7rem .8rem;font-size:.95rem}
td{padding:.7rem .8rem;border-bottom:1px solid var(--borde);vertical-align:middle}
td select{padding:.4rem .5rem}
.detalle{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1.5rem;margin:1rem 0}
.detalle dt{font-weight:bold;color:var(--tinta);font-size:.92rem}.detalle dd{margin:0 0 .7rem}
.detalle .ancho{grid-column:1/-1}
.historial{margin:.4rem 0 0;padding-left:1.2rem}
.foto{max-width:100%;max-height:320px;border:1px solid var(--borde);border-radius:4px}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--verde-osc);color:#fff;padding:.7rem 1.2rem;border-radius:6px;z-index:9}
footer{border-top:1px solid var(--borde);padding:1.4rem 0;font-size:.92rem;text-align:center;color:#6b7360}
@media(max-width:900px){.hero-grid,.tres{grid-template-columns:1fr;gap:1.6rem}.pasos,.stats{grid-template-columns:1fr 1fr}.filtros{grid-template-columns:1fr}}
@media(max-width:600px){.pasos,.stats,.dos,.detalle{grid-template-columns:1fr}.buscar{flex-direction:column}.sesion{border:0;margin:0;padding:0}.hero{padding:2rem 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.demo{background:var(--banda);border-bottom:1px solid var(--borde);font-size:.88rem;padding:.4rem 1rem;text-align:center;color:var(--texto)}
.pill{color:#232d17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tinta:#eef0e0;--texto:#cfd3bf;--crema:#1d2216;--card:#262d1c;--borde:#3d4530;--salvia:#2c3320;--banda:#2a311f}
:root:not([data-theme="light"]) .aviso{background:#2f3822}:root:not([data-theme="light"]) .btn.sec{color:var(--tinta);border-color:#6b7360}:root:not([data-theme="light"]) .ayuda{color:#aab09a}}
:root[data-theme="dark"]{--tinta:#eef0e0;--texto:#cfd3bf;--crema:#1d2216;--card:#262d1c;--borde:#3d4530;--salvia:#2c3320;--banda:#2a311f}
</style></head><body>
<div class="demo">Vista previa interactiva · los datos se guardan solo en tu navegador · Administrador: admin1@codejalisco.mx / Admin#2026</div>
<div id="app"></div>
<script>
const CUR={path:'/index.html',search:''};
const PAGES={"/index.html": {"t": "Inicio · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header><div class=\"wrap\" id=\"alerta\"><\/div>\n<main>\n<section class=\"hero\"><div class=\"wrap hero-grid\"><div>\n  <span class=\"chip\">Sprint 3 · Registro, inicio de sesión y perfiles<\/span>\n  <h1>Reporta los problemas de tu comunidad de forma fácil y rápida<\/h1>\n  <p class=\"lead\">CodeJalisco conecta a los ciudadanos con las dependencias responsables. Envía tu reporte con fotografía y ubicación, obtén un folio y consulta en cualquier momento si ya fue atendido.<\/p>\n  <div class=\"acciones\" id=\"cta\"><\/div><\/div>\n  <aside class=\"card\"><h2>Problemas que puedes reportar<\/h2><ul class=\"lista\" id=\"categorias\"><\/ul><\/aside><\/div><\/section>\n<section class=\"seccion wrap\"><h2>¿Cómo funciona la plataforma?<\/h2><p>Flujo de navegación definido durante el segundo sprint a partir del Product Backlog del primero.<\/p>\n  <div class=\"pasos\">\n  <div class=\"card\"><div class=\"num\">1<\/div><h3>Crea tu cuenta<\/h3><p>Regístrate con tu correo o con Google para iniciar sesión.<\/p><\/div>\n  <div class=\"card\"><div class=\"num\">2<\/div><h3>Registra el problema<\/h3><p>Selecciona la categoría, describe lo que sucede y agrega foto y ubicación.<\/p><\/div>\n  <div class=\"card\"><div class=\"num\">3<\/div><h3>Recibe tu folio<\/h3><p>Al enviar el reporte el sistema genera un folio único para consultarlo después.<\/p><\/div>\n  <div class=\"card\"><div class=\"num\">4<\/div><h3>Da seguimiento<\/h3><p>Consulta si tu reporte fue recibido, revisado, atendido o cerrado.<\/p><\/div><\/div><\/section>\n<section class=\"banda\"><div class=\"wrap tres\">\n  <div><h3>Para el ciudadano<\/h3><p>Un solo lugar para reportar sin necesidad de saber a qué dependencia acudir.<\/p><\/div>\n  <div><h3>Para la dependencia<\/h3><p>Un panel exclusivo para administradores con los reportes recibidos, clasificados por categoría y estado de atención.<\/p><\/div>\n  <div><h3>Para el proyecto<\/h3><p>Continuidad del Sprint 2: las pantallas navegables ahora funcionan con cuentas, roles y datos reales.<\/p><\/div><\/div><\/section>\n<\/main>\n\n<footer id=\"pie\"><\/footer>", "j": "\ninit().then(async ({u}) => {\n  if (new URLSearchParams(CUR.search).get('error') === 'permiso') aviso(document.getElementById('alerta'), 'No tienes permiso para acceder a esa sección.', 'error');\n  const adm = u && u.rol === 'administrador';\n  document.getElementById('cta').innerHTML = adm\n    ? '<a class=\"btn\" href=\"/panel.html\">Ir al Panel de dependencia<\/a><a class=\"btn sec\" href=\"/consultar.html\">Consultar un folio<\/a>'\n    : '<a class=\"btn\" href=\"/reportar.html\">Crear un reporte<\/a><a class=\"btn sec\" href=\"/consultar.html\">Consultar mi folio<\/a>' + (u ? '' : '<a class=\"btn sec\" href=\"/registro.html\">Crear cuenta<\/a>');\n  const cats = await api('/api/categorias');\n  document.getElementById('categorias').innerHTML = cats.map(c => `<li>${esc(c.nombre)}<\/li>`).join('');\n}).catch(()=>{});\n"}, "/login.html": {"t": "Iniciar sesión · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header><main class=\"pagina\"><div class=\"wrap angosta\">\n  <h1>Iniciar sesión<\/h1><p>Accede con tu cuenta de ciudadano o de administrador de reportes.<\/p>\n  <div id=\"msg\"><\/div>\n  <form class=\"card\" id=\"f\" novalidate>\n    <div class=\"campo\"><label for=\"correo\">Correo electrónico *<\/label><input id=\"correo\" type=\"email\" autocomplete=\"email\" required><\/div>\n    <div class=\"campo\"><label for=\"pw\">Contraseña *<\/label><input id=\"pw\" type=\"password\" autocomplete=\"current-password\" required><\/div>\n    <button class=\"btn\" id=\"ok\" type=\"submit\">Iniciar sesión<\/button>\n    <div class=\"separador\">o<\/div>\n    <a class=\"btn google\" href=\"/auth/google\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path fill=\"#EA4335\" d=\"M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z\"/><path fill=\"#4285F4\" d=\"M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z\"/><path fill=\"#FBBC05\" d=\"M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z\"/><path fill=\"#34A853\" d=\"M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z\"/><\/svg>Continuar con Google<\/a>\n    <p class=\"ayuda\">¿Aún no tienes cuenta? <a href=\"/registro.html\">Regístrate<\/a>. Los administradores inician sesión solo con su correo institucional y contraseña.<\/p>\n  <\/form><\/div><\/main>\n\n<footer id=\"pie\"><\/footer>", "j": "\nconst p = new URLSearchParams(CUR.search), msg = document.getElementById('msg');\nconst errores = { google: 'El acceso con Google aún no está configurado en este servidor. Usa tu correo y contraseña o consulta la documentación.', google_fallo: 'No se pudo completar el acceso con Google. Intenta de nuevo.', admin_google: 'Las cuentas de administrador solo pueden iniciar sesión con correo y contraseña.' };\nif (errores[p.get('error')]) aviso(msg, errores[p.get('error')], 'error');\ninit('invitado');\ndocument.getElementById('f').onsubmit = async e => {\n  e.preventDefault(); const b = document.getElementById('ok'); b.disabled = true; aviso(msg, '');\n  try {\n    const { usuario } = await api('/api/login', { method: 'POST', body: { correo: correo.value, password: pw.value } });\n    const next = p.get('next');\n    go(next && next.startsWith('/') && !next.startsWith('//') ? next : (usuario.rol === 'administrador' ? '/panel.html' : '/index.html'));\n  } catch (er) { aviso(msg, er.message, 'error'); b.disabled = false; }\n};\n"}, "/registro.html": {"t": "Registro · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header><main class=\"pagina\"><div class=\"wrap angosta\">\n  <h1>Crear una cuenta<\/h1><p>Regístrate como ciudadano para reportar problemas y consultar su estado. Los campos marcados con * son obligatorios.<\/p>\n  <div id=\"msg\"><\/div>\n  <form class=\"card\" id=\"f\" novalidate>\n    <div class=\"campo\"><label for=\"nombre\">Nombre completo *<\/label><input id=\"nombre\" autocomplete=\"name\" required><\/div>\n    <div class=\"campo\"><label for=\"correo\">Correo electrónico *<\/label><input id=\"correo\" type=\"email\" autocomplete=\"email\" required><\/div>\n    <div class=\"dos\">\n      <div class=\"campo\"><label for=\"pw\">Contraseña *<\/label><input id=\"pw\" type=\"password\" autocomplete=\"new-password\" required><p class=\"ayuda\">Mínimo 8 caracteres, con letras y números.<\/p><\/div>\n      <div class=\"campo\"><label for=\"pw2\">Confirmar contraseña *<\/label><input id=\"pw2\" type=\"password\" autocomplete=\"new-password\" required><\/div><\/div>\n    <button class=\"btn\" id=\"ok\" type=\"submit\">Crear cuenta<\/button>\n    <div class=\"separador\">o<\/div>\n    <a class=\"btn google\" href=\"/auth/google\">Registrarse con Google<\/a>\n    <p class=\"ayuda\">¿Ya tienes cuenta? <a href=\"/login.html\">Inicia sesión<\/a>.<\/p>\n  <\/form><\/div><\/main>\n\n<footer id=\"pie\"><\/footer>", "j": "\nconst msg = document.getElementById('msg'); init('invitado');\ndocument.getElementById('f').onsubmit = async e => {\n  e.preventDefault(); aviso(msg, '');\n  if (pw.value !== pw2.value) return aviso(msg, 'Las contraseñas no coinciden.', 'error');\n  const b = document.getElementById('ok'); b.disabled = true;\n  try { await api('/api/registro', { method: 'POST', body: { nombre: nombre.value, correo: correo.value, password: pw.value } }); go('/index.html'); }\n  catch (er) { aviso(msg, er.message, 'error'); b.disabled = false; }\n};\n"}, "/reportar.html": {"t": "Reportar problema · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header><main class=\"pagina\"><div class=\"wrap\">\n  <h1>Registrar un reporte<\/h1><p>Completa la información del problema. Los campos marcados con * son obligatorios.<\/p>\n  <div id=\"msg\"><\/div>\n  <div id=\"exito\" hidden class=\"card\"><h2>Reporte enviado<\/h2><p>Guarda tu folio para consultar el estado de tu reporte:<\/p><p style=\"font-size:1.8rem;font-weight:bold;color:var(--tinta)\" id=\"folio\"><\/p><div class=\"acciones\"><a class=\"btn\" id=\"ver\" href=\"#\">Consultar este folio<\/a><a class=\"btn sec\" href=\"/reportar.html\">Enviar otro reporte<\/a><\/div><\/div>\n  <form class=\"card\" id=\"f\" novalidate>\n    <div class=\"campo\"><label for=\"categoria\">Tipo de problema *<\/label><select id=\"categoria\" required><option value=\"\">Selecciona una opción<\/option><\/select><\/div>\n    <div class=\"campo\"><label for=\"descripcion\">Descripción del problema *<\/label><textarea id=\"descripcion\" maxlength=\"1000\" placeholder=\"Explica qué sucede, desde cuándo y cómo afecta a la comunidad.\" required><\/textarea><\/div>\n    <div class=\"dos\"><div class=\"campo\"><label for=\"municipio\">Municipio *<\/label><input id=\"municipio\" required><\/div><div class=\"campo\"><label for=\"colonia\">Colonia *<\/label><input id=\"colonia\" required><\/div>\n    <div class=\"campo\"><label for=\"calle\">Calle y número o cruce *<\/label><input id=\"calle\" required><\/div><div class=\"campo\"><label for=\"referencia\">Referencia<\/label><input id=\"referencia\" placeholder=\"Frente a la escuela, junto al parque...\"><\/div>\n    <div class=\"campo\"><label for=\"foto\">Fotografía del problema<\/label><input id=\"foto\" type=\"file\" accept=\"image/png,image/jpeg,image/webp\"><p class=\"ayuda\">PNG, JPG o WebP, máximo 2 MB.<\/p><\/div><div class=\"campo\"><label for=\"correo\">Correo de contacto<\/label><input id=\"correo\" type=\"email\" placeholder=\"opcional, para recibir avisos\"><\/div><\/div>\n    <div class=\"fila-btn\"><button class=\"btn\" id=\"ok\" type=\"submit\">Enviar reporte<\/button><a class=\"btn sec\" href=\"/index.html\">Cancelar<\/a><\/div>\n  <\/form><\/div><\/main>\n\n<footer id=\"pie\"><\/footer>", "j": "\nconst msg = document.getElementById('msg');\ninit('ciudadano').then(async ({u}) => {\n  correo.value = u.correo;\n  const prev = await api('/api/reportes/mios');\n  if (prev.length) { document.getElementById('f').hidden = true; document.getElementById('exito').hidden = false; document.querySelector('#exito h2').textContent = 'Ya generaste tu folio'; document.querySelector('#exito p').textContent = 'Cada cuenta de ciudadano puede generar un solo reporte. Este es tu folio:'; document.getElementById('folio').textContent = prev[0].folio; document.getElementById('ver').href = '/consultar.html?folio=' + encodeURIComponent(prev[0].folio); document.querySelector('#exito .sec').remove(); return; }\n  (await api('/api/categorias')).forEach(c => categoria.add(new Option(c.nombre, c.nombre)));\n});\nconst leer = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });\ndocument.getElementById('f').onsubmit = async e => {\n  e.preventDefault(); aviso(msg, '');\n  const file = foto.files[0];\n  if (file && file.size > 2e6) return aviso(msg, 'La fotografía no puede pesar más de 2 MB.', 'error');\n  const b = document.getElementById('ok'); b.disabled = true;\n  try {\n    const r = await api('/api/reportes', { method: 'POST', body: { categoria: categoria.value, descripcion: descripcion.value, municipio: municipio.value, colonia: colonia.value, calle: calle.value, referencia: referencia.value, correo: correo.value, foto: file ? await leer(file) : null } });\n    document.getElementById('f').hidden = true; document.getElementById('exito').hidden = false;\n    document.getElementById('folio').textContent = r.folio; document.getElementById('ver').href = '/consultar.html?folio=' + encodeURIComponent(r.folio);\n  } catch (er) { aviso(msg, er.message, 'error'); b.disabled = false; }\n};\n"}, "/consultar.html": {"t": "Consultar folio · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header><main class=\"pagina\"><div class=\"wrap\">\n  <h1>Consultar el estado de un reporte<\/h1><p>Escribe el folio que recibiste al momento de enviar tu reporte.<\/p>\n  <form class=\"card\" id=\"f\" novalidate><label for=\"folio\">Folio del reporte<\/label>\n    <div class=\"buscar\"><input id=\"folio\" placeholder=\"Ejemplo: CJ-2026-1001\" autocomplete=\"off\"><button class=\"btn\" type=\"submit\">Buscar<\/button><\/div><\/form>\n  <div id=\"msg\" style=\"margin-top:1.2rem\"><\/div><div id=\"res\"><\/div>\n  <section id=\"mios\" hidden style=\"margin-top:2.2rem\"><h2>Mis reportes<\/h2><div class=\"card tabla-wrap\"><table><thead><tr><th>Folio<\/th><th>Categoría<\/th><th>Fecha<\/th><th>Estado<\/th><\/tr><\/thead><tbody id=\"tb\"><\/tbody><\/table><\/div><\/section>\n<\/div><\/main>\n\n<footer id=\"pie\"><\/footer>", "j": "\nconst msg = document.getElementById('msg'), res = document.getElementById('res');\nasync function buscar(f) {\n  aviso(msg, ''); res.innerHTML = ''; f = f.trim().toUpperCase();\n  if (!/^CJ-\\d{4}-\\d+$/.test(f)) return aviso(msg, 'El folio debe tener el formato CJ-AAAA-NNNN, por ejemplo CJ-2026-1001.', 'error');\n  try { res.innerHTML = detalleReporte(await api('/api/reportes/' + encodeURIComponent(f))); } catch (e) { aviso(msg, e.message, 'error'); }\n}\ninit('auth').then(async ({u}) => {\n  const q = new URLSearchParams(CUR.search).get('folio'); if (q) { folio.value = q; buscar(q); }\n  if (u.rol === 'ciudadano') {\n    const rs = await api('/api/reportes/mios'); document.getElementById('mios').hidden = false;\n    document.getElementById('tb').innerHTML = rs.length ? rs.map(r => `<tr><td><a href=\"?folio=${esc(r.folio)}\"><b>${esc(r.folio)}<\/b><\/a><\/td><td>${esc(r.categoria)}<\/td><td>${esc(r.fecha)}<\/td><td>${pill(r.estado)}<\/td><\/tr>`).join('')\n      : '<tr><td colspan=\"4\">Aún no has enviado reportes. <a href=\"/reportar.html\">Crea el primero<\/a>.<\/td><\/tr>';\n  }\n});\ndocument.getElementById('f').onsubmit = e => { e.preventDefault(); buscar(folio.value); };\n"}, "/panel.html": {"t": "Panel de dependencia · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header><main class=\"pagina\"><div class=\"wrap\">\n  <h1>Panel de dependencia<\/h1><p>Vista interna para dar seguimiento a los reportes enviados por la ciudadanía.<\/p>\n  <div class=\"stats\" id=\"stats\"><\/div>\n  <div class=\"card filtros\"><div class=\"campo\"><label for=\"fc\">Filtrar por categoría<\/label><select id=\"fc\"><option value=\"\">Todas<\/option><\/select><\/div>\n    <div class=\"campo\"><label for=\"fe\">Filtrar por estado<\/label><select id=\"fe\"><option value=\"\">Todos<\/option><\/select><\/div>\n    <div class=\"campo\"><label for=\"q\">Buscar por folio o colonia<\/label><input id=\"q\" placeholder=\"CJ-2026-1001, Centro...\"><\/div><\/div>\n  <div id=\"msg\"><\/div>\n  <div class=\"card tabla-wrap\"><table><thead><tr><th>Folio<\/th><th>Categoría<\/th><th>Ubicación<\/th><th>Fecha<\/th><th>Reportó<\/th><th>Estado<\/th><th>Actualizar<\/th><\/tr><\/thead><tbody id=\"tb\"><\/tbody><\/table><\/div>\n<\/div><\/main>\n\n<footer id=\"pie\"><\/footer>", "j": "\nlet datos = [], estados = [];\nfunction pintar() {\n  const t = q.value.trim().toLowerCase();\n  const v = datos.filter(r => (!fc.value || r.categoria === fc.value) && (!fe.value || r.estado === fe.value) && (!t || r.folio.toLowerCase().includes(t) || r.colonia.toLowerCase().includes(t)));\n  stats.innerHTML = estados.map(e => `<div class=\"card\">${esc(e)}<b>${datos.filter(r => r.estado === e).length}<\/b><\/div>`).join('');\n  tb.innerHTML = v.length ? v.map(r => `<tr><td><a href=\"/consultar.html?folio=${esc(r.folio)}\"><b>${esc(r.folio)}<\/b><\/a><\/td><td>${esc(r.categoria)}<\/td><td>${esc(r.colonia)}, ${esc(r.municipio)}<\/td><td>${esc(r.fecha)}<\/td><td>${esc(r.usuarioNombre)}<\/td><td>${pill(r.estado)}<\/td>\n    <td><select data-f=\"${esc(r.folio)}\" aria-label=\"Actualizar estado de ${esc(r.folio)}\">${estados.map(e => `<option${e === r.estado ? ' selected' : ''}>${esc(e)}<\/option>`).join('')}<\/select><\/td><\/tr>`).join('')\n    : '<tr><td colspan=\"7\">No hay reportes que coincidan con los filtros.<\/td><\/tr>';\n}\ninit('administrador').then(async () => {\n  estados = await api('/api/estados'); (await api('/api/categorias')).forEach(c => fc.add(new Option(c.nombre, c.nombre))); estados.forEach(e => fe.add(new Option(e, e)));\n  datos = await api('/api/reportes'); pintar();\n}).catch(e => aviso(document.getElementById('msg'), e.message, 'error'));\n[fc, fe, q].forEach(el => el.oninput = pintar);\ntb.onchange = async e => {\n  const f = e.target.dataset.f; if (!f) return;\n  try { const r = await api(`/api/reportes/${f}/estado`, { method: 'PATCH', body: { estado: e.target.value } }); datos = datos.map(d => d.folio === f ? r : d); toast(`Estado de ${f} actualizado`); }\n  catch (er) { aviso(document.getElementById('msg'), er.message, 'error'); }\n  pintar();\n};\n"}, "/docs.html": {"t": "Documentación · CodeJalisco", "h": "<header class=\"top\" id=\"top\"><\/header>\n<main class=\"pagina\"><div class=\"wrap\">\n  <h1>Documentación<\/h1><p>Guía de uso y resumen técnico de CodeJalisco, plataforma ciudadana para reportar problemas urbanos.<\/p>\n  <div class=\"card\"><h2>¿Qué problema resuelve?<\/h2><p>Reportar un problema de la ciudad suele ser complicado porque no se sabe a qué dependencia acudir. CodeJalisco ofrece un solo lugar para reportar baches, fallas de alumbrado, árboles caídos, acumulación de basura y fugas de agua, y consultar después si ya fueron atendidos.<\/p><\/div>\n  <div class=\"card\" style=\"margin-top:1.2rem\"><h2>Cómo usar la plataforma<\/h2>\n    <h3>Ciudadano<\/h3><ol class=\"historial\"><li>Crea tu cuenta en <a href=\"/registro.html\">Registrarse<\/a> (correo o Google) e inicia sesión.<\/li><li>En <a href=\"/reportar.html\">Reportar problema<\/a> elige la categoría, describe lo que ocurre, indica la ubicación y, si quieres, agrega una fotografía.<\/li><li>Al enviar recibes tu folio con formato <b>CJ-AAAA-NNNN<\/b>. Cada cuenta de ciudadano genera un solo folio.<\/li><li>En <a href=\"/consultar.html\">Consultar folio<\/a> revisa si tu reporte fue recibido, está en revisión, en atención o atendido.<\/li><\/ol>\n    <h3 style=\"margin-top:1rem\">Administrador de reportes<\/h3><ol class=\"historial\"><li>Inicia sesión desde <a href=\"/login.html\">Iniciar sesión<\/a> con tu cuenta institucional.<\/li><li>En el <b>Panel de dependencia<\/b> filtra y busca reportes, y cambia su estado; cada cambio queda en el historial.<\/li><li>En <b>Consultar folio<\/b> revisa el detalle completo de cualquier reporte, incluida la fotografía.<\/li><\/ol><\/div>\n  <div class=\"card\" style=\"margin-top:1.2rem\"><h2>Permisos por rol<\/h2><div class=\"tabla-wrap\"><table style=\"min-width:560px\"><thead><tr><th>Función<\/th><th>Ciudadano<\/th><th>Administrador<\/th><\/tr><\/thead><tbody>\n    <tr><td>Registrarse / iniciar sesión<\/td><td>Sí<\/td><td>Solo inicia sesión<\/td><\/tr>\n    <tr><td>Generar un reporte (folio)<\/td><td>Sí, uno por cuenta<\/td><td>No<\/td><\/tr>\n    <tr><td>Consultar folio<\/td><td>Detalle completo del suyo; solo el estado de los demás<\/td><td>Detalle completo de todos<\/td><\/tr>\n    <tr><td>Panel de dependencia y cambio de estado<\/td><td>No<\/td><td>Sí<\/td><\/tr><\/tbody><\/table><\/div><\/div>\n  <div class=\"card\" style=\"margin-top:1.2rem\"><h2>Estados de un reporte<\/h2><p>Un reporte avanza por: <span class=\"pill\">Recibido<\/span> <span class=\"pill rev\">En revisión<\/span> <span class=\"pill aten\">En atención<\/span> <span class=\"pill ok\">Atendido<\/span><\/p><\/div>\n  <div class=\"card\" style=\"margin-top:1.2rem\"><h2>Sprints del proyecto<\/h2><ul class=\"lista\"><li><b>Sprint 1:<\/b> análisis, requisitos, Product Backlog y planeación inicial.<\/li><li><b>Sprint 2:<\/b> diseño de interfaz, estructura y navegación.<\/li><li><b>Sprint 3:<\/b> registro, inicio de sesión y perfiles.<\/li><li><b>Sprints 4 a 8:<\/b> registro completo de problemas, ubicación y folios, seguimiento, panel administrativo, pruebas y entrega final.<\/li><\/ul><\/div>\n<\/div><\/main><footer id=\"pie\"><\/footer>", "j": "init();"}};
function go(u){const x=new URL(u,'https://x'+CUR.path);CUR.path=x.pathname==='/'?'/index.html':x.pathname;CUR.search=x.search;render();window.scrollTo(0,0);}
function render(){const p=PAGES[CUR.path]||PAGES['/index.html'];document.title=p.t;document.getElementById('app').innerHTML=p.h;
  try{new Function(p.j)();}catch(e){console.error(e);}}
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');
  if(h.startsWith('http')||h.startsWith('#'))return;e.preventDefault();go(h.startsWith('/auth/google')?'/login.html?error=google':h);});
</script>
<script>// CodeJalisco · utilidades compartidas: API, encabezado según rol y guardas de página.
async function api(url, o = {}) {
  const r = await fetch(url, { credentials: 'same-origin', ...o, headers: { 'Content-Type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(d.error || 'Ocurrió un error inesperado.'); e.status = r.status; throw e; }
  return d;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pillClase = e => ({ 'En revisión': 'rev', 'En atención': 'aten', 'Atendido': 'ok' }[e] || '');
const pill = e => `<span class="pill ${pillClase(e)}">${esc(e)}</span>`;
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }
function aviso(el, msg, tipo = '') { el.innerHTML = msg ? `<div class="aviso ${tipo}" role="${tipo ? 'alert' : 'status'}">${esc(msg)}</div>` : ''; }

/* init(): carga la sesión, aplica la regla de acceso de la página y dibuja el encabezado.
   requiere: 'ciudadano' | 'administrador' | 'auth' | 'invitado' | undefined */
async function init(requiere) {
  const { usuario: u, google } = await api('/api/me');
  const aqui = CUR.path + CUR.search;
  if (requiere === 'invitado' && u) return go(u.rol === 'administrador' ? '/panel.html' : '/index.html'), new Promise(() => {});
  if (requiere && requiere !== 'invitado') {
    if (!u) return go('/login.html?next=' + encodeURIComponent(aqui)), new Promise(() => {});
    if (requiere !== 'auth' && u.rol !== requiere) return go('/index.html?error=permiso'), new Promise(() => {});
  }
  const enlaces = [['/index.html', 'Inicio'], ['/reportar.html', 'Reportar problema', !u || u.rol === 'ciudadano'], ['/consultar.html', 'Consultar folio'],
    ['/panel.html', 'Panel de dependencia', u && u.rol === 'administrador'], ['/docs.html', 'Documentación']];
  const nav = enlaces.filter(l => l[2] === undefined || l[2]).map(([h, t]) => `<a href="${h}"${CUR.path === h || (h === '/index.html' && CUR.path === '/') ? ' aria-current="page"' : ''}>${t}</a>`).join('');
  const cuenta = u
    ? `<span class="sesion"><span>${esc(u.nombre)}<span class="rol">${u.rol === 'administrador' ? 'Administrador' : 'Ciudadano'}</span></span><button id="salir" type="button">Cerrar sesión</button></span>`
    : `<a href="/login.html"${CUR.path === '/login.html' ? ' aria-current="page"' : ''}>Iniciar sesión</a><a href="/registro.html"${CUR.path === '/registro.html' ? ' aria-current="page"' : ''}>Registrarse</a>`;
  document.getElementById('top').innerHTML = `<div class="wrap"><a class="marca" href="/index.html"><span class="logo">CJ</span><span><b>CodeJalisco</b><small>Plataforma ciudadana de reportes urbanos</small></span></a><nav aria-label="Principal">${nav}${cuenta}</nav></div>`;
  const s = document.getElementById('salir');
  if (s) s.onclick = async () => { await api('/api/logout', { method: 'POST' }); go('/index.html'); };
  const f = document.getElementById('pie'); if (f) f.innerHTML = '<div class="wrap">CodeJalisco · Proyecto universitario, Desarrollo de Sistemas Web · Sprint 3</div>';
  return { u, google };
}
/* Detalle de un reporte (usado por Consultar folio) */
function detalleReporte(r) {
  const hist = r.historial.map(h => `<li>${esc(h.estado)} · ${esc(h.fecha)}${h.por ? ' · ' + esc(h.por) : ''}</li>`).join('');
  const campos = r.limitada
    ? `<dt>Categoría</dt><dd>${esc(r.categoria)}</dd><dt>Fecha</dt><dd>${esc(r.fecha)}</dd><dt>Ubicación</dt><dd class="ancho">${esc(r.colonia)}, ${esc(r.municipio)}</dd>`
    : `<dt>Categoría</dt><dd>${esc(r.categoria)}</dd><dt>Fecha</dt><dd>${esc(r.fecha)}</dd>
       <dt>Ubicación</dt><dd class="ancho">${esc(r.calle)}, ${esc(r.colonia)}, ${esc(r.municipio)}${r.referencia ? ' (' + esc(r.referencia) + ')' : ''}</dd>
       <dt>Descripción</dt><dd class="ancho">${esc(r.descripcion)}</dd><dt>Reportado por</dt><dd>${esc(r.usuarioNombre)}</dd><dt>Correo de contacto</dt><dd>${esc(r.correo || '—')}</dd>`;
  return `<article class="card"><h2>${esc(r.folio)} ${pill(r.estado)}</h2><dl class="detalle">${campos}
    <div class="ancho"><dt>Seguimiento</dt><dd><ol class="historial">${hist}</ol></dd></div>
    ${r.tieneFoto ? `<div class="ancho"><dt>Fotografía</dt><dd><img class="foto" src="${esc(r.fotoData)}" alt="Fotografía del problema reportado"></dd></div>` : ''}</dl>
    ${r.limitada ? '<p class="ayuda">Por privacidad, solo se muestra el estado general de los reportes de otras personas.</p>' : ''}</article>`;
}
</script>

const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e), t=(v,n)=>String(v==null?'':v).trim().slice(0,n), hoy=()=>new Date().toISOString().slice(0,10);
api=async(url,o={})=>{const m=o.method||'GET',b=o.body||{};let x;
 if(url==='/api/me')return{usuario:me()?pub(me()):null,google:false,limiteReportes:1};
 if(url==='/api/categorias')return CATS; if(url==='/api/estados')return ESTADOS;
 if(url==='/api/registro'){const nombre=t(b.nombre,80),correo=t(b.correo,120).toLowerCase(),pw=String(b.password||'');

  if(!r.municipio||!r.colonia||!r.calle)bad(400,'Municipio, colonia y calle son obligatorios.');if(r.correo&&!emailOk(r.correo))bad(400,'El correo de contacto no es válido.');
  if(b.foto&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(b.foto))bad(400,'La fotografía debe ser PNG, JPG o WebP.');
  const folio='CJ-'+new Date().getFullYear()+'-'+(Math.max(1000,...DB.reportes.map(r=>+r.folio.split('-')[2]))+1);
  const n={folio,...r,estado:'Recibido',fecha:hoy(),usuarioId:u.id,usuarioNombre:u.nombre,fotoData:b.foto||null,historial:[{estado:'Recibido',fecha:hoy()}]};
  DB.reportes.push(n);save();return full(n);}
 if(url==='/api/reportes/mios'){const u=need('ciudadano');return DB.reportes.filter(r=>r.usuarioId===u.id).map(full).reverse();}
 if(url==='/api/reportes'){need('administrador');return DB.reportes.map(full);}

  if(!ESTADOS.includes(b.estado))bad(400,'Estado no válido.');if(r.estado!==b.estado){r.estado=b.estado;r.historial.push({estado:b.estado,fecha:hoy(),por:me().nombre});save();}return full(r);}
 if(x=url.match(/^\/api\/reportes\/(CJ-\d{4}-\d+)$/)){const u=need();const r=DB.reportes.find(r=>r.folio===x[1]);if(!r)bad(404,'No encontramos un reporte con ese folio.');return(u.rol==='administrador'||r.usuarioId===u.id)?full(r):lim(r);}
